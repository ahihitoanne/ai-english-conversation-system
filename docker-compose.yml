services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vocabtalk_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vocabtalk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vocabtalk"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Web UI để xem bảng dữ liệu trực quan trong trình duyệt (http://localhost:8080)
  adminer:
    image: adminer:latest
    container_name: vocabtalk_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

  # Backend Container (Dành cho Cách 2: Chạy toàn bộ bằng Docker)
  backend:
    profiles: ["all", "full"]
    build:
      context: .
      dockerfile: core_backend/Dockerfile
    container_name: vocabtalk_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/vocabtalk
      - GROQ_API_KEY=${GROQ_API_KEY:-gsk_your_groq_api_key_here}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_api_key_here}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
