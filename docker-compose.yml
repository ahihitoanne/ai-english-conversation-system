version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vocabtalk_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vocabtalk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vocabtalk"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Web UI để xem bảng dữ liệu trực quan trong trình duyệt (http://localhost:8080)
  adminer:
    image: adminer:latest
    container_name: vocabtalk_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data:
